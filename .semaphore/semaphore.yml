version: v1.0
name: turbo-showcase
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2204
auto_cancel:
  running:
    when: "branch != 'main'"

blocks:
  - name: tests
    execution_time_limit:
      minutes: 15
    task:
      env_vars:
        - name: RAILS_ENV
          value: test
        - name: CI
          value: "true"
      prologue:
        commands:
          - checkout --use-cache
          - sem-version ruby $(cat .ruby-version)
          - cache restore
          - bundle config set deployment 'true'
          - bundle config set path 'vendor/bundle'
          - bundle install -j 4
          - cache store
          - bin/rails db:prepare
      jobs:
        - name: tests
          commands:
            - bin/check
      epilogue:
        on_fail:
          commands:
            - artifact push job tmp/screenshots --force || true
            - artifact push job log/test.log --force || true

promotions:
  - name: main-deploy
    pipeline_file: main-deploy.yml
    auto_promote:
      when: "result = 'passed' and branch = 'main'"
